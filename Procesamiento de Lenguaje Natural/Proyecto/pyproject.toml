[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "chatpnl-streamlit-labs"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
description = "Laboratorios formativos de PLN en español"
[tool.setuptools]
package-dir = {"" = "src"}
packages = ["chatpnl_labs"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: requiere CHATPNL_TEST_MYSQL_URL de una base de pruebas vacía"]
